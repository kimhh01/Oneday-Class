version: '3.8'

services:
  spring-app:
    build: .
    container_name: spring-app
    expose:
      - "8080"
    restart: unless-stopped
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - spring-app
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge