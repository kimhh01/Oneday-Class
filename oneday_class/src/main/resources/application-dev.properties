spring.application.name=oneday_class

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false

# 로컬 개발은 소스 폴더의 비밀 설정을 읽고, 배포 JAR은 같은 폴더의 외부 파일을 읽는다.
# 두 파일 모두 Git과 JAR 패키징 대상에서 제외한다.
spring.config.import=optional:file:./application-secret.properties,optional:file:./src/main/resources/application-secret.properties

# ---------------------------------------------------------
# MyBatis
# ---------------------------------------------------------
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.default-fetch-size=100
mybatis.configuration.default-statement-timeout=30
mybatis.type-aliases-package=com.example.member.domain
mybatis.configuration.jdbc-type-for-null=varchar
