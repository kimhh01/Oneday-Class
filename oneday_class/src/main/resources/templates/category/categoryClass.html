<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}" />
<meta name="_csrf_header"
	th:content="${_csrf != null ? _csrf.headerName : ''}" />

<title>원데이클래스 - 카테고리</title>
<link rel="stylesheet" th:href="@{/category/css/category.css}">
</head>
<body class="with-toolbar">

	<div th:replace="~{common/header :: headerFragment}"></div>

	<!-- 1. 상단 타이틀 & 검색바 -->
	<div class="header-bottom">
		<h1>원데이클래스</h1>
		<form class="search-box" th:action="@{/search}" method="get">
			<div class="search-icon">
				<img th:src="@{/images/icon/search_icon.svg}" alt="검색 아이콘"
					style="width: 15px; height: 15px;">
			</div>
			<input type="search" name="keyword" placeholder="원하는 키워드를 검색해보세요.">
			<button type="submit">검색</button>
		</form>
	</div>

	<main class="content">
		<section>
			<!-- 페이지 타이틀 -->
			<h2 class="page-title"
				th:text="${currentCategoryName != null ? currentCategoryName : '전체'}">전체</h2>

			<!-- 2. 대분류 카테고리 탭 (왼쪽 정렬) -->
			<nav class="main-category">
  <a th:href="@{/category/class(sameDayOnly=${searchDTO.sameDayOnly}, sameWeekOnly=${searchDTO.sameWeekOnly})}" 
     th:classappend="${searchDTO.categoryCode == null or searchDTO.categoryCode == 0 ? 'active' : ''}">전체</a>
  <a th:each="cat : ${categoryList}" 
     th:if="${cat.parentCategoryCode == null}"
     th:href="@{/category/class(categoryCode=${cat.categoryCode}, sameDayOnly=${searchDTO.sameDayOnly}, sameWeekOnly=${searchDTO.sameWeekOnly})}"
     th:text="${cat.categoryName}"
     th:classappend="${searchDTO.categoryCode == cat.categoryCode ? 'active' : ''}">카테고리</a>
</nav>

			<!-- 3. 소분류 카테고리 탭 (대분류 선택 시 노출) -->
			<nav class="sub-category" th:if="${searchDTO.categoryCode != null and searchDTO.categoryCode > 0}">
  <a th:href="@{/category/class(categoryCode=${searchDTO.categoryCode}, sameDayOnly=${searchDTO.sameDayOnly}, sameWeekOnly=${searchDTO.sameWeekOnly})}"
     th:classappend="${searchDTO.subCategoryCode == null or searchDTO.subCategoryCode == 0 ? 'active' : ''}">전체</a>
  <a th:each="subCat : ${categoryList}"
     th:if="${subCat.parentCategoryCode == searchDTO.categoryCode}"
     th:href="@{/category/class(categoryCode=${searchDTO.categoryCode}, subCategoryCode=${subCat.categoryCode}, sameDayOnly=${searchDTO.sameDayOnly}, sameWeekOnly=${searchDTO.sameWeekOnly})}"
     th:text="${subCat.categoryName}"
     th:classappend="${searchDTO.subCategoryCode == subCat.categoryCode ? 'active' : ''}">소분류</a>
</nav>

			<!-- 4. 정렬 & 필터 툴바 -->
			<div class="toolbar">
				<details class="sort-dropdown">
					<summary
						th:text="${searchDTO.sort != null and searchDTO.sort != '' ? searchDTO.sort : '신규순'}">신규순</summary>
					<div class="sort-menu">
  <a th:href="@{/category/class(categoryCode=${searchDTO.categoryCode}, subCategoryCode=${searchDTO.subCategoryCode}, sort='신규순', minPrice=${searchDTO.minPrice}, maxPrice=${searchDTO.maxPrice}, minPeople=${searchDTO.minPeople}, sameDayOnly=${searchDTO.sameDayOnly}, sameWeekOnly=${searchDTO.sameWeekOnly})}">신규순</a>
  <a th:href="@{/category/class(categoryCode=${searchDTO.categoryCode}, subCategoryCode=${searchDTO.subCategoryCode}, sort='추천순', minPrice=${searchDTO.minPrice}, maxPrice=${searchDTO.maxPrice}, minPeople=${searchDTO.minPeople}, sameDayOnly=${searchDTO.sameDayOnly}, sameWeekOnly=${searchDTO.sameWeekOnly})}">추천순</a>
  <a th:href="@{/category/class(categoryCode=${searchDTO.categoryCode}, subCategoryCode=${searchDTO.subCategoryCode}, sort='낮은 가격순', minPrice=${searchDTO.minPrice}, maxPrice=${searchDTO.maxPrice}, minPeople=${searchDTO.minPeople}, sameDayOnly=${searchDTO.sameDayOnly}, sameWeekOnly=${searchDTO.sameWeekOnly})}">낮은 가격순</a>
  <a th:href="@{/category/class(categoryCode=${searchDTO.categoryCode}, subCategoryCode=${searchDTO.subCategoryCode}, sort='높은 가격순', minPrice=${searchDTO.minPrice}, maxPrice=${searchDTO.maxPrice}, minPeople=${searchDTO.minPeople}, sameDayOnly=${searchDTO.sameDayOnly}, sameWeekOnly=${searchDTO.sameWeekOnly})}">높은 가격순</a>
</div>
				</details>

				<button type="button" class="filter-link" onclick="openFilter()"
					style="background: none; border: none; cursor: pointer;">
					필터 ⚙</button>
			</div>

			<!-- 5. 클래스 카드 그리드 -->
			<section class="class-grid">
				<div th:if="${#lists.isEmpty(classList)}"
					style="grid-column: 1/-1; text-align: center; padding: 60px 0; color: #888;">
					검색 조건에 맞는 클래스가 없습니다.</div>

				<article class="class-card" th:each="cls : ${classList}">
					<div style="position: relative;">
						<!-- 찜(북마크) 하트 버튼 -->
						<button type="button" class="bookmark-btn"
							th:data-class-code="${cls.classCode}"
							onclick="toggleBookmark(event, this)">
							<svg width="20" height="20" viewBox="0 0 24 24" fill="none"
								stroke="#e33838" stroke-width="2">
        <path
									d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
      </svg>
						</button>
      <button type="button" class="filter-link" onclick="openFilter()" style="background:none; border:none; cursor:pointer;">
        필터 ⚙
      </button>
    </div>

    <!-- 5. 클래스 카드 그리드 -->
    <section class="class-grid">
      <div th:if="${#lists.isEmpty(classList)}" style="grid-column: 1/-1; text-align: center; padding: 60px 0; color: #888;">
        검색 조건에 맞는 클래스가 없습니다.
      </div>

      <article class="class-card" th:each="cls : ${classList}">
        <div style="position: relative;">
          <!-- 찜(북마크) 하트 버튼 -->
          <button type="button" class="bookmark-btn" 
                  th:data-class-code="${cls.classCode}" 
                  onclick="toggleBookmark(event, this)">
            <svg width="20" height="20" viewBox="0 0 24 24" 
                 th:fill="${bookmarkedClassCodes != null and #lists.contains(bookmarkedClassCodes, cls.classCode)} ? '#e33838' : 'none'" 
                 stroke="#e33838" stroke-width="2">
              <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
            </svg>
          </button>

						<a th:href="@{/class/detail(classCode=${cls.classCode})}"> <img
							th:src="${cls.mainImage != null and cls.mainImage.startsWith('http') ? cls.mainImage : '/images/class/' + cls.mainImage}"
							th:alt="${cls.name}">
						</a>
					</div>
          <a th:href="@{/class/detail(classCode=${cls.classCode})}"> 
            <img th:src="${cls.mainImage != null and cls.mainImage.startsWith('http') ? cls.mainImage : '/images/class/' + cls.mainImage}"
                 th:alt="${cls.name}"> 
          </a>
        </div>

					<a th:href="@{/class/detail(classCode=${cls.classCode})}">
						<div class="class-meta" th:text="${cls.address}">위치 정보</div>
						<div class="class-title" th:text="${cls.name}">클래스명</div>
						<div class="class-price">
							<span class="now"
								th:text="${#numbers.formatInteger((cls.desiredPrice != null and cls.desiredPrice > 0 and cls.price > cls.desiredPrice) ? cls.desiredPrice : cls.price, 0, 'COMMA') + '원'}"></span>
						</div>
					</a>
				</article>
        <a th:href="@{/class/detail(classCode=${cls.classCode})}">
          <div class="class-meta" th:text="${cls.address}">위치 정보</div>
          <div class="class-title" th:text="${cls.name}">클래스명</div>
          <div class="class-price">
            <span class="now" th:text="${#numbers.formatInteger((cls.desiredPrice != null and cls.desiredPrice > 0 and cls.price > cls.desiredPrice) ? cls.desiredPrice : cls.price, 0, 'COMMA') + '원'}"></span>
          </div>
        </a>
      </article>
      
    </section>
  </section>
</main>


			</section>
		</section>
	</main>

	<!-- 우측 필터 슬라이드 패널 -->
	<div class="filter-page">
		<a class="filter-dim" onclick="closeFilter()" aria-label="필터 닫기"></a>
		<aside class="filter-panel">

			<form th:action="@{/category/class}" method="get" id="filterForm">
				<input type="hidden" name="categoryCode" id="filterMainCategory" th:value="${searchDTO.categoryCode}" />
				<input type="hidden" name="subCategoryCode" id="filterSubCategory" th:value="${searchDTO.subCategoryCode}" />
				<input type="hidden" name="minPrice" id="filterMinPrice" th:value="${searchDTO.minPrice}" />
				<input type="hidden" name="maxPrice" id="filterMaxPrice" th:value="${searchDTO.maxPrice}" />
				<input type="hidden" name="minPeople" id="filterMinPeople" th:value="${searchDTO.minPeople}" />
				<input type="hidden" name="sort" th:value="${searchDTO.sort}" />
				<input type="hidden" name="sameDayOnly" value="true" th:if="${searchDTO.sameDayOnly}" />
				<input type="hidden" name="sameWeekOnly" value="true" th:if="${searchDTO.sameWeekOnly}" />
			</form>

			<div class="filter-title-row">
				<h3>필터</h3>
				<a class="filter-close" onclick="closeFilter()"
					style="cursor: pointer;">×</a>
			</div>

			<div class="filter-content">
				<section class="filter-section">
					<h4>상세 카테고리</h4>
					<div class="chips">
						<th:block
							th:if="${searchDTO.categoryCode == null or searchDTO.categoryCode == 0}">
							<a class="chip"
								th:classappend="${searchDTO.categoryCode == null or searchDTO.categoryCode == 0 ? 'selected' : ''}"
								onclick="selectMainCat(0, this)">전체</a>

							<a class="chip" th:each="cat : ${categoryList}"
								th:if="${cat.parentCategoryCode == null}"
								th:classappend="${searchDTO.categoryCode == cat.categoryCode ? 'selected' : ''}"
								th:text="${cat.categoryName}"
								th:onclick="|selectMainCat(${cat.categoryCode}, this)|">대분류</a>
						</th:block>

						<th:block
							th:if="${searchDTO.categoryCode != null and searchDTO.categoryCode > 0}">
							<a class="chip"
								th:classappend="${searchDTO.subCategoryCode == null or searchDTO.subCategoryCode == 0 ? 'selected' : ''}"
								onclick="selectSubCat(0, this)">전체</a>

							<a class="chip" th:each="sub : ${categoryList}"
								th:if="${sub.parentCategoryCode != null and sub.parentCategoryCode == searchDTO.categoryCode}"
								th:classappend="${searchDTO.subCategoryCode == sub.categoryCode ? 'selected' : ''}"
								th:text="${sub.categoryName}"
								th:onclick="|selectSubCat(${sub.categoryCode}, this)|">소분류</a>
						</th:block>
					</div>
				</section>

				<section class="filter-section">
					<h4>가격</h4>
					<div class="chips">
						<a class="chip"
							th:classappend="${searchDTO.maxPrice == 30000 ? 'selected' : ''}"
							onclick="selectPrice(0, 30000, this)">3만원 이하</a> <a class="chip"
							th:classappend="${searchDTO.minPrice == 30000 and searchDTO.maxPrice == 50000 ? 'selected' : ''}"
							onclick="selectPrice(30000, 50000, this)">3-5만원</a> <a
							class="chip"
							th:classappend="${searchDTO.minPrice == 50000 and searchDTO.maxPrice == 100000 ? 'selected' : ''}"
							onclick="selectPrice(50000, 100000, this)">5-10만원</a> <a
							class="chip"
							th:classappend="${searchDTO.minPrice == 100000 ? 'selected' : ''}"
							onclick="selectPrice(100000, 0, this)">10만원 이상</a>
					</div>
				</section>

				<section class="filter-section">
					<h4>인원</h4>
					<div class="chips">
						<a class="chip"
							th:classappend="${searchDTO.minPeople == 1 ? 'selected' : ''}"
							onclick="selectPeople(1, this)">1명</a> <a class="chip"
							th:classappend="${searchDTO.minPeople == 2 ? 'selected' : ''}"
							onclick="selectPeople(2, this)">2명</a> <a class="chip"
							th:classappend="${searchDTO.minPeople == 3 ? 'selected' : ''}"
							onclick="selectPeople(3, this)">3명</a> <a class="chip"
							th:classappend="${searchDTO.minPeople == 4 ? 'selected' : ''}"
							onclick="selectPeople(4, this)">4명</a> <a class="chip"
							th:classappend="${searchDTO.minPeople == 5 ? 'selected' : ''}"
							onclick="selectPeople(5, this)">5명 이상</a>
					</div>
				</section>
			</div>

			<div class="filter-bottom">
				<a class="reset" th:href="@{/category/class(categoryCode=${searchDTO.categoryCode}, sameDayOnly=${searchDTO.sameDayOnly}, sameWeekOnly=${searchDTO.sameWeekOnly})}">↻ 초기화</a>
				<a class="apply" onclick="submitFilter()" style="cursor: pointer;">선택 검색하기</a>
			</div>
		</aside>
	</div>

	<script>
function openFilter() {
    document.querySelector('.filter-page').classList.add('active');
}

function closeFilter() {
    document.querySelector('.filter-page').classList.remove('active');
}

function selectMainCat(code, el) {
    document.getElementById('filterMainCategory').value = code;
    document.getElementById('filterSubCategory').value = 0;
    toggleSelected(el);
}

function selectSubCat(code, el) {
    document.getElementById('filterSubCategory').value = code;
    toggleSelected(el);
}

function selectPrice(min, max, el) {
    document.getElementById('filterMinPrice').value = min;
    document.getElementById('filterMaxPrice').value = max;
    toggleSelected(el);
}

function selectPeople(count, el) {
    document.getElementById('filterMinPeople').value = count;
    toggleSelected(el);
}

function toggleSelected(el) {
    const group = el.closest('.chips');
    group.querySelectorAll('.chip').forEach(c => c.classList.remove('selected'));
    el.classList.add('selected');
}

function submitFilter() {
    document.getElementById('filterForm').submit();
}

function toggleBookmark(event, btn) {
    event.stopPropagation();
    event.preventDefault();

    const classCode = btn.getAttribute('data-class-code');
    const tokenMeta = document.querySelector("meta[name='_csrf']");
    const headerMeta = document.querySelector("meta[name='_csrf_header']");

    const headers = { 'Content-Type': 'application/x-www-form-urlencoded' };
    if (tokenMeta && headerMeta && tokenMeta.getAttribute("content")) {
        headers[headerMeta.getAttribute("content")] = tokenMeta.getAttribute("content");
    }

    fetch('/mypage/bookmark/toggle', {
        method: 'POST',
        headers: headers,
        body: 'classCode=' + encodeURIComponent(classCode)
    })
    .then(response => response.text())
    .then(data => {
        const svg = btn.querySelector('svg');
        if (data === 'ADDED') {
            if (svg) svg.setAttribute('fill', '#e33838');
            if (confirm('관심 클래스에 추가되었습니다!\n마이페이지 관심 클래스로 이동하시겠습니까?')) {
                location.href = '/mypage/bookmark';
            }
        } else if (data === 'REMOVED') {
            if (svg) svg.setAttribute('fill', 'none');
            alert('관심 클래스에서 해제되었습니다.');
        } else if (data === 'LOGIN_REQUIRED') {
            alert('로그인이 필요한 서비스입니다.');
            location.href = '/member/login';
        }
    })
    .catch(error => console.error('Error:', error));
}
</script>

	<div th:replace="~{common/footer :: footerFragment}"></div>

</body>
</html>
