<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" th:href="@{/admin/css/admin-common.css}">
<link rel="stylesheet" th:href="@{/admin/css/admin-layout.css}">
<link rel="stylesheet" th:href="@{/admin/css/admin-notice.css}">
<title>공지사항 등록</title>
</head>
<body>
	<div th:replace="~{admin/fragments/sideMenu :: sideMenu('notice')}"></div>
	<main class="main notice-page">
		<h1>공지사항 등록</h1>
		<form class="notice-form" th:action="@{/admin/notices}" method="post"
			th:object="${noticeDTO}">
			<section class="panel form-panel">
				<h3>공지 기본 정보</h3>
				<div class="row">
					<label>제목 *</label><input th:field="*{noticeTitle}" maxlength="100"
						required>
				</div>
				<div class="row">
					<label>구분 *</label><select th:field="*{noticeType}" required><option
							value="">구분 선택</option>
						<option value="서비스">서비스</option>
						<option value="이용안내">이용안내</option></select>
				</div>
				<div class="row">
					<label>공개 여부</label>
					<div class="check">
						<input type="hidden" id="status" th:field="*{status}"><input
							type="checkbox" id="publicCheck" th:checked="*{status=='공개'}"><label
							for="publicCheck">공개</label><small>체크하지 않으면 비공개로 저장됩니다.</small>
					</div>
				</div>
				<div class="row">
					<label>공지 내용 *</label>
					<textarea th:field="*{noticeContent}" maxlength="500" required></textarea>
				</div>
			</section>
			<div class="actions">
				<a class="btn" th:href="@{/admin/notices}">취소</a>
				<button class="btn primary" type="submit">저장</button>
			</div>
		</form>
	</main>
	<script>document.querySelector('.notice-form').addEventListener('submit',()=>{document.getElementById('status').value=document.getElementById('publicCheck').checked?'공개':'비공개';});</script>
</body>
</html>
