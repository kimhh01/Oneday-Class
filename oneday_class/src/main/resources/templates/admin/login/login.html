<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>관리자 로그인</title>
<link rel="stylesheet" th:href="@{/admin/css/admin-login.css}">
</head>
<body>
	<main class="login-page">
		<div class="login-wrap">
			<header class="brand">
				<p class="brand-sub">일상을 배우는 내일공간</p>
				<h1>Admin</h1>
			</header>
			<section class="login-card">
				<h2>관리자 로그인</h2>
				<form th:action="@{/admin/login}" method="post">

					<div class="form-group">
						<label for="id">아이디</label> <input type="text" id="id" name="id"
							placeholder="아이디를 입력해주세요" autocomplete="username" required>
					</div>
					<div class="form-group">
						<label for="password">비밀번호</label> <input type="password"
							id="password" name="password" placeholder="비밀번호를 입력해주세요"
							autocomplete="current-password" required>
					</div>
					<button type="submit" class="login-submit">로그인</button>
				</form>
			</section>
		</div>
	</main>
	<script>const p=document.getElementById('password'),b=document.getElementById('passwordToggle');b.addEventListener('click',()=>{const h=p.type==='password';p.type=h?'text':'password';b.textContent=h?'숨김':'보기';});</script>
	<script th:if="${param.error}">
    alert("아이디 또는 비밀번호가 일치하지 않습니다.");
    window.history.replaceState(
        null,
        "",
        "/admin/login"
    );
</script>
</body>
</html>
