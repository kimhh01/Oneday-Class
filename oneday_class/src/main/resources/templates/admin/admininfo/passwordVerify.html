<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>비밀번호 재확인</title>

<link rel="stylesheet"
      th:href="@{/admin/css/admin-common.css}">

<link rel="stylesheet"
      th:href="@{/admin/css/admin-info.css}">
</head>

<body class="password-verify-body">

<main class="password-verify-page">

    <div class="verify-brand">
        <p>일상을 배우는 내일공간</p>
        <h1>Admin</h1>
    </div>

    <section class="password-verify-card">

        <h2>비밀번호 재확인</h2>

        <p class="verify-description">
            관리자 정보 변경을 위해<br>
            현재 비밀번호를 다시 입력해주세요.
        </p>

        <form th:action="@{/admin/info/verify}"
              method="post"
              th:object="${verifyDTO}">

            <div class="verify-form-group">

                <label for="adminId">
                    아이디
                </label>

                <input id="adminId"
                       type="text"
                       th:value="${adminId}"
                       readonly>

            </div>

            <div class="verify-form-group">

                <label for="currentPassword">
                    비밀번호
                </label>

                <input id="currentPassword"
                       type="password"
                       th:field="*{currentPassword}"
                       placeholder="비밀번호를 입력해주세요"
                       autocomplete="current-password"
                       required>

            </div>

            <p class="verify-error"
               th:if="${error}"
               th:text="${error}">
            </p>

            <button type="submit"
                    class="verify-submit">
                확인
            </button>

        </form>

    </section>

</main>

</body>
</html>
