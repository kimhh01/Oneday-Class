<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비밀번호 변경 | 숨쉬당</title>
    <link rel="stylesheet" th:href="@{/profile/css/changePassword.css}">
</head>
<body>

<!-- 모달 배경 오버레이 -->
<div class="modal-backdrop" onclick="closeModalOnBackdrop(event)">
    <div class="modal-card">
        
        <!-- 1. 모달 헤더 -->
        <div class="modal-header">
            <div class="header-text">
                <h2 class="modal-title">비밀번호 변경</h2>
                <p class="modal-subtitle">안전한 계정 관리를 위해 비밀번호를 주기적으로 변경해주세요.</p>
            </div>
            <button type="button" class="btn-close" onclick="closeModal()" aria-label="닫기">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#666666" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>

        <!-- 2. 비밀번호 변경 Form -->
        <form th:action="@{/profile/changePassword}" method="post" id="passChangeForm">
            <input type="hidden" name="memberCode" th:value="${session.loginMember != null ? session.loginMember.memberCode : 0}">

            <div class="modal-body">
                
                <!-- 현재 비밀번호 (currentPass) -->
                <div class="form-group">
                    <label for="currentPass" class="form-label">현재 비밀번호</label>
                    <div class="input-wrapper">
                        <input type="password" id="currentPass" name="currentPass" class="form-input" 
                               placeholder="현재 비밀번호를 입력해주세요." required>
                        <button type="button" class="btn-toggle-eye" onclick="togglePasswordVisibility('currentPass', this)">
                            <svg class="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#888888" stroke-width="2">
                                <path class="eye-open" d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" style="display:none;"></path>
                                <circle class="eye-open" cx="12" cy="12" r="3" style="display:none;"></circle>
                                <path class="eye-closed" d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                <line class="eye-closed" x1="1" y1="1" x2="23" y2="23"></line>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- 새 비밀번호 (newPass) -->
                <div class="form-group">
                    <label for="newPass" class="form-label">새 비밀번호</label>
                    <div class="input-wrapper">
                        <input type="password" id="newPass" name="newPass" class="form-input" 
                               placeholder="새 비밀번호를 입력해주세요." required>
                        <button type="button" class="btn-toggle-eye" onclick="togglePasswordVisibility('newPass', this)">
                            <svg class="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#888888" stroke-width="2">
                                <path class="eye-open" d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" style="display:none;"></path>
                                <circle class="eye-open" cx="12" cy="12" r="3" style="display:none;"></circle>
                                <path class="eye-closed" d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                <line class="eye-closed" x1="1" y1="1" x2="23" y2="23"></line>
                            </svg>
                        </button>
                    </div>
                    <p class="field-hint">8~16자 영문, 숫자, 특수문자를 조합하여 입력해주세요.</p>
                </div>

                <!-- 새 비밀번호 확인 (newPassConfirm) -->
                <div class="form-group">
                    <label for="newPassConfirm" class="form-label">새 비밀번호 확인</label>
                    <div class="input-wrapper">
                        <input type="password" id="newPassConfirm" name="newPassConfirm" class="form-input" 
                               placeholder="새 비밀번호를 다시 입력해주세요." required>
                        <button type="button" class="btn-toggle-eye" onclick="togglePasswordVisibility('newPassConfirm', this)">
                            <svg class="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#888888" stroke-width="2">
                                <path class="eye-open" d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" style="display:none;"></path>
                                <circle class="eye-open" cx="12" cy="12" r="3" style="display:none;"></circle>
                                <path class="eye-closed" d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                <line class="eye-closed" x1="1" y1="1" x2="23" y2="23"></line>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- 3. 하단 보안 팁 박스 -->
                <div class="tip-box">
                    <div class="tip-header">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2b6e3f" stroke-width="2">
                            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                            <polyline points="9 11 12 14 22 4"></polyline>
                        </svg>
                        <span class="tip-title">안전한 비밀번호를 위한 팁</span>
                    </div>
                    <p class="tip-content">
                        영문 대/소문자, 숫자, 특수문자를 조합하여 다른 사이트와 다른 비밀번호를 사용해주세요.
                    </p>
                </div>

            </div>

            <!-- 4. 푸터 버튼 영역 -->
            <div class="modal-footer">
                <button type="button" class="btn-cancel" onclick="closeModal()">취소</button>
                <button type="submit" class="btn-save">변경하기</button>
            </div>
        </form>

    </div>
</div>

<script>
    function togglePasswordVisibility(inputId, btn) {
        const input = document.getElementById(inputId);
        const openIcons = btn.querySelectorAll('.eye-open');
        const closedIcons = btn.querySelectorAll('.eye-closed');

        if (input.type === 'password') {
            input.type = 'text';
            openIcons.forEach(el => el.style.display = 'block');
            closedIcons.forEach(el => el.style.display = 'none');
        } else {
            input.type = 'password';
            openIcons.forEach(el => el.style.display = 'none');
            closedIcons.forEach(el => el.style.display = 'block');
        }
    }

    // 💡 AJAX (fetch) 기반 폼 제출 및 유효성 검사
    document.getElementById('passChangeForm').addEventListener('submit', function(e) {
        e.preventDefault(); // 기본 폼 이동 방지 (모달 유지 핵심)

        const currentPass = document.getElementById('currentPass').value.trim();
        const newPass = document.getElementById('newPass').value.trim();
        const newPassConfirm = document.getElementById('newPassConfirm').value.trim();

        // 영문, 숫자, 특수문자 조합 8~16자 정규식
        const passRegex = /^(?=.*[a-zA-Z])(?=.*\d)(?=.*[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]).{8,16}$/;

        function notify(msg) {
            if (typeof showProfileAlert === 'function') {
                showProfileAlert(msg);
            } else {
                alert(msg);
            }
        }

        // --- [프론트엔드 1차 검증] ---
        // 1. 기존 비밀번호와 동일한지 체크
        if (currentPass === newPass) {
            notify('기존 비밀번호와 동일한 비밀번호는 사용할 수 없습니다.');
            document.getElementById('newPass').focus();
            return;
        }

        // 2. 새 비밀번호 조건(영문+숫자+특수문자 조합 8~16자) 체크
        if (!passRegex.test(newPass)) {
            notify('새 비밀번호는 8~16자의 영문, 숫자, 특수문자를 조합하여 입력해야 합니다.');
            document.getElementById('newPass').focus();
            return;
        }

        // 3. 새 비밀번호 확인 일치 체크
        if (newPass !== newPassConfirm) {
            notify('새 비밀번호와 확인용 비밀번호가 일치하지 않습니다.');
            document.getElementById('newPassConfirm').focus();
            return;
        }

        // --- [2차 서버 비동기 요청 (AJAX)] ---
        const formData = new FormData(this);

        // CSRF 토큰 추출
        const tokenMeta = document.querySelector("meta[name='_csrf']");
        const headerMeta = document.querySelector("meta[name='_csrf_header']");
        const headers = {};
        if (tokenMeta && headerMeta && tokenMeta.content) {
            headers[headerMeta.content] = tokenMeta.content;
        }

        fetch('/profile/changePassword', {
            method: 'POST',
            headers: headers,
            body: formData
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                // ⭕ 비밀번호 변경 성공 시:
                // 1) 비밀번호 변경 모달 닫기
                if (typeof closeModal === 'function') {
                    closeModal();
                }
                // 2) 성공 안내 모달 띄우기
                notify(data.message);
            } else {
                // ❌ 현재 비밀번호 오류 등 실패 시:
                // 비밀번호 변경 모달을 닫지 않고 그 위에 안내 모달 띄움
                notify(data.message);
            }
        })
        .catch(error => {
            console.error('Error:', error);
            notify('서버 통신 중 오류가 발생했습니다.');
        });
    });
</script>

</body>
</html>
