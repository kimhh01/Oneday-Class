<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- 공통 알림 모달 Fragment -->
<div th:fragment="alertModal">
    <!-- 💡 th:if를 제거하고, msg가 있을 때만 display: flex가 되도록 수정 (JS 조작 가능) -->
    <div class="modal-backdrop" id="alertModal" 
         th:style="${msg != null} ? 'display: flex;' : 'display: none;'">
        <div class="alert-modal-card">
            <div class="alert-modal-header">
                <h3 class="alert-modal-title">알림</h3>
            </div>
            <div class="alert-modal-body">
                <p class="alert-modal-message" id="alertModalMessage" th:text="${msg}">처리 결과 메시지</p>
            </div>
            <div class="alert-modal-footer">
                <button type="button" class="btn-confirm" onclick="closeAlertModal()">확인</button>
            </div>
        </div>
    </div>

    <style>
        .modal-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .alert-modal-card {
            width: 100%;
            max-width: 360px;
            background-color: #ffffff;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            text-align: center;
            animation: alertModalFadeIn 0.2s ease-out;
        }
        .alert-modal-header {
            margin-bottom: 12px;
        }
        .alert-modal-title {
            font-size: 18px;
            font-weight: 700;
            color: #111111;
        }
        .alert-modal-body {
            margin-bottom: 20px;
        }
        .alert-modal-message {
            font-size: 14.5px;
            color: #444444;
            line-height: 1.5;
            word-break: keep-all;
        }
        .alert-modal-footer {
            display: flex;
            justify-content: center;
        }
        .btn-confirm {
            width: 100%;
            height: 44px;
            background-color: #356846;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 14.5px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.15s ease;
        }
        .btn-confirm:hover {
            background-color: #2a5337;
        }
        @keyframes alertModalFadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>

    <script>
        function closeAlertModal() {
            const modal = document.getElementById('alertModal');
            if (modal) {
                modal.style.display = 'none';
                document.body.style.overflow = 'auto';
            }
        }
    </script>
</div>

</body>
</html>
