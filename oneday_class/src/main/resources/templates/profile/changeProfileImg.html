<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프로필 이미지 변경 | 숨쉬당</title>
    <link rel="stylesheet" th:href="@{/profile/css/changeProfileImg.css}">
</head>
<body>

<!-- 모달 오버레이 배경 -->
<div class="modal-backdrop" onclick="closeModalOnBackdrop(event)">
    <div class="modal-card">
        
        <!-- 1. 헤더 영역 -->
        <div class="modal-header">
            <div class="header-text">
                <h2 class="modal-title">프로필 이미지 변경</h2>
                <p class="modal-subtitle">프로필로 사용할 이미지를 선택해주세요.</p>
            </div>
            <button type="button" class="btn-close" onclick="closeModal()" aria-label="닫기">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#666666" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>

        <!-- 2. Form 영역 -->
        <form th:action="@{/profile/changeProfileImg}" method="post" enctype="multipart/form-data" id="profileImgForm">
            <!-- 이미지 모드 타입 (FILE: 파일 업로드 / DEFAULT: 기본 이미지) -->
            <input type="hidden" name="imageMode" id="imageMode" value="FILE">

            <div class="modal-body">
                <label class="section-label">이미지 선택</label>

                <!-- 옵션 선택 카드가 2개 놓이는 그리드 -->
                <div class="option-grid">
                    
                    <!-- 옵션 1: 파일 업로드 -->
                    <div class="option-card active" id="cardFile" onclick="window.selectOption('FILE')">
                        <div class="card-icon icon-green">
                            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#356846" stroke-width="1.8">
                                <rect x="3" y="3" width="18" height="18" rx="3" ry="3"/>
                                <circle cx="8.5" cy="8.5" r="1.5"/>
                                <polyline points="21 15 16 10 5 21"/>
                                <line x1="18" y1="9" x2="18" y2="15" stroke-width="2"/>
                                <line x1="15" y1="12" x2="21" y2="12" stroke-width="2"/>
                            </svg>
                        </div>
                        <h4 class="card-title">파일 업로드</h4>
                        <p class="card-desc">PC에서 이미지를 선택하세요.</p>
                    </div>

                    <!-- 옵션 2: 기본 이미지 -->
                    <div class="option-card" id="cardDefault" onclick="window.selectOption('DEFAULT')">
                        <div class="card-icon icon-gray">
                            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#666666" stroke-width="1.8">
                                <circle cx="12" cy="12" r="10"/>
                                <path d="M8 14s1.5 2 4 2 4-2 4-2"/>
                                <line x1="9" y1="9" x2="9.01" y2="9" stroke-width="2.5"/>
                                <line x1="15" y1="9" x2="15.01" y2="9" stroke-width="2.5"/>
                            </svg>
                        </div>
                        <h4 class="card-title">기본 이미지</h4>
                        <p class="card-desc">기본 프로필 이미지로 설정합니다.</p>
                    </div>

                </div>

                <!-- [영역 1] 파일 드롭존 (FILE 선택 시 노출) -->
                <div class="dropzone" id="dropzone" onclick="document.getElementById('fileInput').click()">
                    <input type="file" name="image" id="fileInput" accept="image/jpeg, image/png, image/jpg" onchange="window.handleFileSelect(this)">
                    
                    <div class="dropzone-content">
                        <div class="cloud-icon">
                            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#6a737d" stroke-width="1.5">
                                <path d="M16 16l-4-4-4 4"/>
                                <path d="M12 12v9"/>
                                <path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/>
                            </svg>
                        </div>
                        <p class="dropzone-text" id="fileNameText">파일을 드래그하거나 클릭하여 업로드하세요.</p>
                        <p class="dropzone-sub" id="fileSubText">JPG, PNG 파일만 가능 (최대 5MB)</p>
                    </div>
                </div>

                <!-- [영역 2] 기본 이미지 프리뷰 영역 (DEFAULT 선택 시 노출) -->
                <div class="default-preview-zone" id="defaultZone" style="display: none;">
                    <div class="default-avatar-preview">
                        <svg viewBox="0 0 100 100" class="default-avatar-svg">
                            <circle cx="50" cy="50" r="50" fill="#E2EFCB"/>
                            <circle cx="50" cy="40" r="18" fill="#526848"/>
                            <path d="M20 82c0-16.5 13.5-30 30-30s30 13.5 30 30" fill="#526848"/>
                        </svg>
                    </div>
                    <p class="default-preview-text">숨쉬당 기본 프로필 이미지로 설정됩니다.</p>
                </div>

            </div>

            <!-- 3. 푸터 버튼 영역 -->
            <div class="modal-footer">
                <button type="button" class="btn-cancel" onclick="closeModal()">취소</button>
                <button type="submit" class="btn-save">저장하기</button>
            </div>
        </form>

    </div>
</div>

<script>
(function() {
    // 1. 옵션 선택 함수 (전역 등록)
    window.selectOption = function(mode) {
        document.getElementById('imageMode').value = mode;
        const cardFile = document.getElementById('cardFile');
        const cardDefault = document.getElementById('cardDefault');
        const dropzone = document.getElementById('dropzone');
        const defaultZone = document.getElementById('defaultZone');
        const fileInput = document.getElementById('fileInput');

        if (mode === 'FILE') {
            cardFile.classList.add('active');
            cardDefault.classList.remove('active');
            dropzone.style.display = 'flex';
            defaultZone.style.display = 'none';
        } else {
            cardDefault.classList.add('active');
            cardFile.classList.remove('active');
            dropzone.style.display = 'none';
            defaultZone.style.display = 'flex';
            
            // 파일 선택 초기화
            if (fileInput) fileInput.value = '';
            window.handleFileSelect(fileInput);
        }
    };

    // 2. 파일 선택 시 파일명 및 용량 표시 함수 (전역 등록)
    window.handleFileSelect = function(input) {
        const fileNameText = document.getElementById('fileNameText');
        const fileSubText = document.getElementById('fileSubText');
        const dropzone = document.getElementById('dropzone');

        if (input && input.files && input.files[0]) {
            const file = input.files[0];
            const fileSizeMB = (file.size / (1024 * 1024)).toFixed(2);
            
            fileNameText.innerHTML = `선택된 파일: <strong style="color: #356846;">${file.name}</strong>`;
            fileSubText.innerText = `용량: ${fileSizeMB} MB (클릭해서 변경 가능)`;
            if (dropzone) dropzone.classList.add('has-file');
        } else {
            if (fileNameText) fileNameText.innerText = "파일을 드래그하거나 클릭하여 업로드하세요.";
            if (fileSubText) fileSubText.innerText = "JPG, PNG 파일만 가능 (최대 5MB)";
            if (dropzone) dropzone.classList.remove('has-file');
        }
    };

    // 3. 드래그 & 드롭 이벤트 바인딩
    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('fileInput');

    if (dropzone) {
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropzone.addEventListener(eventName, function(e) {
                e.preventDefault();
                e.stopPropagation();
            }, false);
        });

        ['dragenter', 'dragover'].forEach(eventName => {
            dropzone.addEventListener(eventName, function() {
                dropzone.classList.add('dragover');
            }, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropzone.addEventListener(eventName, function() {
                dropzone.classList.remove('dragover');
            }, false);
        });

        dropzone.addEventListener('drop', function(e) {
            const dt = e.dataTransfer;
            if (dt && dt.files && dt.files.length > 0) {
                fileInput.files = dt.files;
                window.handleFileSelect(fileInput);
            }
        }, false);
    }
})();
</script>

</body>
</html>
