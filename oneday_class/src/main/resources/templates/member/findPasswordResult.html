<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비밀번호 찾기 결과 | 숨쉬당</title>
    <link rel="stylesheet" th:href="@{/member/css/findPasswordResult.css}">
</head>
<body>

<div class="login-wrapper">

    <!-- 공통 미니 로고 Fragment -->
    <div th:replace="~{member/fragments/common :: miniLogo}"></div>

    <div class="login-card">

        <!-- 상단 완료 아이콘 -->
        <div class="result-icon-wrap">
            <div class="result-icon">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="3" y="5" width="18" height="14" rx="3" stroke="#526848" stroke-width="1.8"/>
                    <path d="M3 7L12 13L21 7" stroke="#526848" stroke-width="1.8" stroke-linecap="round"/>
                    <circle cx="18" cy="16" r="3.5" fill="#6c8260"/>
                    <path d="M16.2 16L17.5 17.3L19.8 15" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
        </div>

        <!-- 헤더 영역 -->
        <div class="login-card__head">
            <h2 class="login-card__title">비밀번호 찾기 결과</h2>
            <p class="login-card__subtitle">
                임시 비밀번호가 회원님의 이메일로 발송되었습니다.<br>
                이메일을 확인하신 후 로그인해주세요.
            </p>
        </div>

        <!-- 이메일 발송 완료 안내 박스 -->
        <div class="result-msg-box">
            <div class="result-msg-box__icon">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" stroke="#526848" stroke-width="1.6"/>
                    <path d="M22 6l-10 7L2 6" stroke="#526848" stroke-width="1.6" stroke-linecap="round"/>
                </svg>
            </div>
            <div class="result-msg-box__text">
                <strong>임시 비밀번호를 이메일로 발송했습니다.</strong>
                <p>이메일을 확인하시면 임시 비밀번호로 로그인할 수 있습니다.</p>
            </div>
        </div>

        <!-- 안내사항 영역 -->
        <div class="result-notice">
            <div class="result-notice__title">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="12" cy="12" r="9" stroke="#716f64" stroke-width="1.5"/>
                    <path d="M12 8v4M12 16h.01" stroke="#716f64" stroke-width="1.8" stroke-linecap="round"/>
                </svg>
                <span>안내사항</span>
            </div>
            <ul class="result-notice__list">
                <li>로그인 후 반드시 비밀번호를 변경해 주세요.</li>
                <li>이메일이 오지 않을 경우 스팸 메일함을 확인해 주세요.</li>
            </ul>
        </div>

        <!-- 버튼 그룹 -->
        <div class="result-buttons">
            <a th:href="@{/member/login/general}" class="btn btn--primary">로그인하기</a>
            <a th:href="@{/member/findPassword}" class="btn btn--outline">이메일 다시 보내기</a>
        </div>

    </div>

</div>

</body>
</html>
