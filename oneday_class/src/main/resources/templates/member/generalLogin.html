<!DOCTYPE html>
<!--
  Spring Boot 프로젝트의 View 파일 (Thymeleaf HTML)
  위치 예시   : src/main/resources/templates/member/generalLogin.html
  매핑 예시   : @GetMapping("/member/login/general") -> Model에 "loginDTO"(빈 LoginDTO) 담아서 return "member/generalLogin";
  참고 사항   :
    - 공통 로고 영역은 member/fragments/common.html의 miniLogo fragment를 사용합니다.
    - 폼 input은 th:object="${loginDTO}" 기준으로 th:field 바인딩되어 있습니다. (LoginDTO 기준)
    - 화면/디자인만 구성한 상태이며, 로그인 처리 등 실제 기능은 아직 구현하지 않았습니다.
-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>일반 로그인 | 숨쉬당</title>
    <link rel="stylesheet" th:href="@{/member/css/generalLogin.css}">
</head>
<body>

<div class="login-wrapper">

    <div th:replace="~{member/fragments/common :: miniLogo}"></div>

    <div class="login-card">

        <div class="login-card__head">
            <h2 class="login-card__title">일반 로그인</h2>
            <p class="login-card__subtitle">아이디와 비밀번호를 입력해 로그인하세요.</p>
        </div>

        <form th:action="@{/member/login}" th:object="${loginDTO}" method="post" class="login-form">

            <div class="login-form__field">
                <label for="memberId" class="login-form__label">아이디</label>
                <input type="text" id="memberId" th:field="*{memberId}" class="login-form__input"
                       placeholder="아이디를 입력해주세요">
            </div>

            <div class="login-form__field">
                <label for="password" class="login-form__label">비밀번호</label>
                <div class="login-form__input-wrap">
                    <input type="password" id="password" th:field="*{password}" class="login-form__input"
                           placeholder="비밀번호를 입력해주세요">
                    <button type="button" class="login-form__toggle-visibility" aria-label="비밀번호 표시">
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z" stroke="#9a9a8f" stroke-width="1.6"/>
                            <circle cx="12" cy="12" r="3.2" stroke="#9a9a8f" stroke-width="1.6"/>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="login-form__row">
                <label class="login-form__checkbox">
                    <input type="checkbox" th:field="*{idSave}" value="Y">
                    <span>아이디 저장</span>
                </label>

                <div class="login-form__links">
                    <a th:href="@{/member/findId}">아이디 찾기</a>
                    <span class="login-form__divider">|</span>
                    <a th:href="@{/member/findPassword}">비밀번호 찾기</a>
                </div>
            </div>

            <button type="submit" class="btn btn--primary">로그인</button>

        </form>

    </div>

    <p class="login-signup">
        아직 계정이 없으신가요?
        <a th:href="@{/member/signup}">회원가입</a>
    </p>

</div>

</body>
</html>
