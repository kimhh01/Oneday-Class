<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>일반 로그인 | 숨쉬당</title>
    <link rel="stylesheet" th:href="@{/member/css/generalLogin.css}">
</head>
<body>

<div class="login-wrapper">

    <div th:replace="~{member/fragments/common :: miniLogo}"></div>

    <div class="login-card">

        <!-- [추가] 상단 왼쪽 X 버튼 (클릭 시 /member/login 으로 이동) -->
        <a th:href="@{/member/login}" class="page-close-x" aria-label="로그인 선택으로 돌아가기">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M18 6L6 18M6 6l12 12" stroke="#716f64" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </a>

        <div class="login-card__head">
            <h2 class="login-card__title">일반 로그인</h2>
            <p class="login-card__subtitle">아이디와 비밀번호를 입력해 로그인하세요.</p>
        </div>

        <!-- 로그인 실패 시 에러 메시지 출력 -->
        <div th:if="${errorMsg}" class="login-error-alert" 
             style="color: #e74c3c; background-color: #fceae9; border: 1px solid #f5c6cb; padding: 10px 14px; border-radius: 6px; font-size: 14px; margin-bottom: 16px; text-align: center;">
            <span th:text="${errorMsg}"></span>
        </div>

        <form th:action="@{/member/login/general}" th:object="${loginDTO}" method="post" class="login-form">

            <!-- 아이디 필드 -->
            <div class="login-form__field">
                <label for="id" class="login-form__label">아이디</label>
                <input type="text" id="id" th:field="*{id}" class="login-form__input"
                       placeholder="아이디(이메일)를 입력해주세요" required>
            </div>

            <!-- 비밀번호 필드 -->
            <div class="login-form__field">
                <label for="password" class="login-form__label">비밀번호</label>
                <div class="login-form__input-wrap">
                    <input type="password" id="password" th:field="*{password}" class="login-form__input"
                           placeholder="비밀번호를 입력해주세요" required>
                    <button type="button" class="login-form__toggle-visibility" aria-label="비밀번호 표시">
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z" stroke="#9a9a8f" stroke-width="1.6"/>
                            <circle cx="12" cy="12" r="3.2" stroke="#9a9a8f" stroke-width="1.6"/>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="login-form__row">

                <div class="login-form__links">
                    <a th:href="@{/member/findId}">아이디 찾기</a>
                    <span class="login-form__divider">|</span>
                    <a th:href="@{/member/findPassword}">비밀번호 찾기</a>
                </div>
            </div>

            <button type="submit" class="btn btn--primary">로그인</button>

        </form>

    </div>

    <p class="login-signup">
        아직 계정이 없으신가요?
        <a th:href="@{/member/signUp}">회원가입</a>
    </p>

</div>
<script>
document.addEventListener('DOMContentLoaded', function() {
    const toggleBtn = document.querySelector('.login-form__toggle-visibility');
    const passwordInput = document.getElementById('password');

    if (toggleBtn && passwordInput) {
        toggleBtn.addEventListener('click', function() {
            // input 타입을 password <-> text 변환
            const isPassword = passwordInput.type === 'password';
            passwordInput.type = isPassword ? 'text' : 'password';

            // 접근성(aria-label) 및 스타일 토글
            toggleBtn.setAttribute('aria-label', isPassword ? '비밀번호 숨기기' : '비밀번호 표시');
            toggleBtn.classList.toggle('active', isPassword);
        });
    }
});
</script>
</body>
</html>
</body>
</html>
