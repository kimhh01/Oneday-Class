<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비밀번호 찾기 | Oneclass</title>

    <!-- CSRF 토큰 메타 태그 -->
    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}"/>
    <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : 'X-CSRF-TOKEN'}"/>

    <link rel="stylesheet" th:href="@{/member/css/findPassword.css}">

</head>
<body>

<div class="login-wrapper">

    <div th:replace="~{member/fragments/common :: miniLogo}"></div>

    <div class="login-card">

        <!-- 상단 왼쪽 X 버튼 (/member/login/general 로 이동) -->
        <a th:href="@{/member/login/general}" class="page-close-x" aria-label="로그인으로 돌아가기">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M18 6L6 18M6 6l12 12" stroke="#716f64" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </a>

        <div class="login-card__head">
            <h2 class="login-card__title">비밀번호 찾기</h2>
            <p class="login-card__subtitle">
                회원님의 정보를 입력하고 인증을 완료하시면<br>
                임시 비밀번호가 이메일로 발급됩니다.
            </p>
        </div>

        <form th:action="@{/member/findPassword}" th:object="${passFindDTO}" method="post" class="login-form">

            <!-- 1. 아이디 -->
            <div class="login-form__field">
                <label for="id" class="login-form__label">아이디</label>
                <input type="text" id="id" th:field="*{id}" class="login-form__input"
                       placeholder="아이디를 입력해주세요" required>
            </div>

            <!-- 2. 이름 -->
            <div class="login-form__field">
                <label for="name" class="login-form__label">이름</label>
                <input type="text" id="name" th:field="*{name}" class="login-form__input"
                       placeholder="이름을 입력해주세요" required>
            </div>

            <!-- 3. 이메일 주소 -->
            <div class="login-form__field">
                <label for="email" class="login-form__label">이메일 주소</label>
                <input type="email" id="email" th:field="*{email}" class="login-form__input"
                       placeholder="이메일 주소를 입력해주세요" required>
            </div>

            <!-- 4. 인증번호 -->
            <div class="login-form__field">
                <label for="authCode" class="login-form__label">인증번호</label>
                <div class="login-form__control--with-button">
                    <input type="text" id="authCode" th:field="*{authCode}" class="login-form__input"
                           placeholder="인증코드를 입력해주세요" required>
                    <button type="button" id="btnSendAuthCode" class="btn btn--outline">인증번호 발송</button>
                </div>
                <p class="login-form__hint">입력하신 이메일로 인증번호가 발송됩니다.</p>
            </div>

            <button type="submit" class="btn btn--primary">비밀번호 찾기</button>

        </form>

    </div>

</div>

<!-- 알림 모달 팝업 -->
<div id="customModal" class="modal-overlay">
    <div class="modal-card">
        <div class="modal-body" id="modalMessage"></div>
        <button type="button" id="btnModalClose" class="btn--modal">확인</button>
    </div>
</div>

<!-- 💡 아이디 찾기와 완전히 동일한 구조의 로딩 오버레이 -->
<div id="loadingOverlay" class="modal-overlay">
    <div class="loading-card">
        <div class="spinner"></div>
        <p class="loading-text">인증번호를 발송 중입니다.<br>잠시만 기다려 주세요.</p>
    </div>
</div>

<script th:inline="javascript">
document.addEventListener('DOMContentLoaded', function () {
    const btnSendAuthCode = document.getElementById('btnSendAuthCode');
    const idInput = document.getElementById('id');
    const nameInput = document.getElementById('name');
    const emailInput = document.getElementById('email');

    const customModal = document.getElementById('customModal');
    const modalMessage = document.getElementById('modalMessage');
    const btnModalClose = document.getElementById('btnModalClose');

    // 로딩 오버레이 요소
    const loadingOverlay = document.getElementById('loadingOverlay');

    // 💡 classList 기반 제어 함수 (아이디 찾기와 동일)
    function showLoading() {
        loadingOverlay.classList.add('active');
    }

    function hideLoading() {
        loadingOverlay.classList.remove('active');
    }

    // CSRF 헤더 생성 공통 함수
    function getCsrfHeaders() {
        const tokenMeta = document.querySelector("meta[name='_csrf']");
        const headerMeta = document.querySelector("meta[name='_csrf_header']");
        const headers = { 
            'Content-Type': 'application/x-www-form-urlencoded' 
        };

        if (tokenMeta && headerMeta && tokenMeta.content) {
            headers[headerMeta.content] = tokenMeta.content;
        }
        return headers;
    }

    function showModal(message) {
        modalMessage.innerHTML = message;
        customModal.classList.add('active');
    }

    function closeModal() {
        customModal.classList.remove('active');
    }

    btnModalClose.addEventListener('click', closeModal);
    customModal.addEventListener('click', function (e) {
        if (e.target === customModal) closeModal();
    });

    // 서버 오류 메시지 모달 띄우기 (인증 실패 등)
    const serverErrorMsg = /*[[${errorMsg}]]*/ null;
    if (serverErrorMsg) {
        showModal(serverErrorMsg);
    }

    // 인증번호 발송 AJAX
    btnSendAuthCode.addEventListener('click', function () {
        const id = idInput.value.trim();
        const name = nameInput.value.trim();
        const email = emailInput.value.trim();

        if (!id) {
            showModal('아이디를 입력해 주세요.');
            idInput.focus();
            return;
        }
        if (!name) {
            showModal('이름을 입력해 주세요.');
            nameInput.focus();
            return;
        }
        if (!email) {
            showModal('이메일 주소를 입력해 주세요.');
            emailInput.focus();
            return;
        }

        // 💡 버튼 상태 변경 및 로딩 오버레이 표시
        const originalText = btnSendAuthCode.textContent;
        btnSendAuthCode.disabled = true;
        btnSendAuthCode.textContent = '발송 중...';
        showLoading();

        fetch('/member/sendPasswordAuthCode', {
            method: 'POST',
            headers: getCsrfHeaders(),
            body: 'id=' + encodeURIComponent(id) +
                  '&name=' + encodeURIComponent(name) +
                  '&email=' + encodeURIComponent(email)
        })
        .then(response => response.text())
        .then(data => {
            // 💡 처리 완료 시 로딩창 숨김 및 버튼 상태 복구
            hideLoading();
            btnSendAuthCode.disabled = false;

            if (data === 'OK') {
                btnSendAuthCode.textContent = '인증번호 재발송';
                showModal('인증번호가 이메일로 발송되었습니다.<br>(5분 이내 입력)');
            } else if (data === 'NOT_FOUND') {
                btnSendAuthCode.textContent = originalText;
                showModal('입력하신 정보와 일치하는 회원 정보가 없습니다.');
            } else {
                btnSendAuthCode.textContent = originalText;
                showModal('메일 발송에 실패했습니다.<br>잠시 후 다시 시도해 주세요.');
            }
        })
        .catch(error => {
            hideLoading();
            btnSendAuthCode.disabled = false;
            btnSendAuthCode.textContent = originalText;
            console.error('Error:', error);
            showModal('통신 중 오류가 발생했습니다.<br>잠시 후 다시 시도해 주세요.');
        });
    });
});
</script>

</body>
</html>
