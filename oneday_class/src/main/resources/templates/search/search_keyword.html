<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>검색 결과 - 솜씨당</title>
    <link rel="stylesheet" th:href="@{/css/search/search.css}">
</head>
<body>

    <div th:replace="~{common/header :: headerFragment}"></div>

    <main class="main-container">
        
        <!-- 상단 검색바 영역 -->
        <form th:action="@{/search}" method="get" class="search-area">
            <div class="search-input-wrap">
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                
                <input type="search" name="keyword" id="searchInput" class="search-input" 
                       th:value="${keyword}" placeholder="원하는 키워드를 검색해보세요.">
                <div class="clear-btn" onclick="clearSearchText()">✖</div>
            </div>
        </form>
        
        <hr class="main-divider">

        <!-- 1. 작가 섹션 -->
        <section class="result-section">
            <h2 class="section-title"><span>작가</span></h2>
            
            <!-- 작가 검색 결과가 없는 경우 -->
            <div th:if="${#lists.isEmpty(creatorList)}" style="color: #888; padding: 20px 0;">
                검색된 작가가 없습니다.
            </div>

            <!-- 작가 목록 그리드 -->
            <div class="artist-grid" th:if="${!#lists.isEmpty(creatorList)}">
                <div class="artist-item" th:each="creator : ${creatorList}">
                    <img th:src="${creator.profileImage != null ? creator.profileImage : '/images/tutor/default_tutor.png'}" 
                         th:alt="${creator.activityName}" class="artist-img">
                    <div class="artist-info">
                        <div class="artist-name" th:text="${creator.activityName}">작가 이름</div>
                        <div class="artist-status" th:text="${creator.creatorIntroduction != null ? creator.creatorIntroduction : '소개글이 없습니다.'}">소개글</div>
                    </div>
                </div>
            </div>

            <!-- 더보기 버튼 -->
            <a th:if="${creatorCount > 3}" 
               th:href="@{/search/creator-more(keyword=${keyword})}" class="btn-more">
                <strong>작가</strong> 검색결과 더보기 &gt;
            </a>
        </section>

        <!-- 2. 클래스 섹션 -->
        <section class="result-section">
            <h2 class="section-title"><span>클래스</span></h2>

            <!-- 클래스 검색 결과가 없는 경우 -->
            <div th:if="${#lists.isEmpty(classList)}" style="color: #888; padding: 20px 0;">
                검색된 클래스가 없습니다.
            </div>

            <!-- 클래스 목록 -->
            <div class="class-list" th:if="${!#lists.isEmpty(classList)}">
                <div class="class-item" th:each="cls : ${classList}">
                    <a th:href="@{/class/detail(classCode=${cls.classCode})}" style="display: flex; gap: 20px; width: 100%;">
                        <img th:src="${cls.mainImage != null ? cls.mainImage : '/images/class/default_class.png'}" 
                             th:alt="${cls.name}" class="class-img">
                        <div class="class-info">
                            <div class="class-location" th:text="${cls.address}">지역 정보</div>
                            <div class="class-title" th:text="${cls.name}">클래스 제목</div>
                            <div class="class-price-info">
                                <span class="final-price" 
                                      th:text="${cls.price != null ? #numbers.formatInteger(cls.price, 0, 'COMMA') + '원' : '0원'}">48,600원</span>
                            </div>
                        </div>
                    </a>
                </div>
            </div>

            <!-- 더보기 버튼 -->
            <a th:if="${classCount > 4}" 
               th:href="@{/search/class-more(keyword=${keyword})}" class="btn-more">
                <strong>클래스</strong> 검색결과 더보기 &gt;
            </a>
        </section>
    </main>

    <div th:replace="~{common/footer :: footerFragment}"></div>

    <script>
        function clearSearchText() {
            const searchInput = document.getElementById('searchInput');
            searchInput.value = '';
            searchInput.focus();
        }
    </script>
</body>
</html>
