<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1:1 문의 | 숨비당 원데이 클래스</title>
<link rel="stylesheet" th:href="@{/author/css/common.css}">
<link rel="stylesheet" th:href="@{/author/css/header.css}">
<link rel="stylesheet" th:href="@{/author/css/sidebar.css}">
<link rel="stylesheet" th:href="@{/author/css/qna.css(v='20260805-3')}">
<script th:src="@{/author/js/layout.js}" defer></script>
</head>
<body class="author-page qna-page qna-list-page" data-menu="qna" data-page="1:1 문의">
<div class="app">
	<div th:replace="~{author/fragments/icons :: icons}"></div><div th:replace="~{author/fragments/header :: header}"></div>
	<div class="app-body"><div th:replace="~{author/fragments/sidebar :: sidebar}"></div>
		<main class="content"><div class="content__inner">
			<header class="qna-page-head"><div><h1 class="page-title">1:1 문의</h1><p class="page-desc">사업 운영에 필요한 문의를 접수하고 관리자 답변을 확인합니다.</p></div><a class="btn btn--primary qna-page-head__action" th:href="@{/author/qna/new}">새 문의 작성</a></header>
			<section class="qna-notice" aria-label="문의 운영 안내"><strong>문의 운영 안내</strong><p>접수된 문의는 영업일 기준 1~2일 이내 순차 답변합니다. 클래스·결제·정산 관련 정보를 함께 남기면 더 빠르게 확인할 수 있습니다.</p></section>
			<section class="qna-stats" aria-label="문의 현황"><article><span>전체 문의</span><p><strong th:text="${summary.totalCount}">0</strong>건</p></article><article><span>답변 대기</span><p><strong class="is-waiting" th:text="${summary.waitingCount}">0</strong>건 확인 중</p></article><article><span>답변 완료</span><p><strong class="is-complete" th:text="${summary.answeredCount}">0</strong>건 확인 가능</p></article></section>

			<form class="qna-filter" method="get" th:action="@{/author/qna}" aria-label="사업자 문의 검색">
				<label class="select"><span class="sr-only">문의 유형</span><select name="inquiryTypeCode"><option value="0" th:selected="${search.inquiryTypeCode == 0}">전체 유형</option><option th:each="type : ${types}" th:value="${type.inquiryTypeCode}" th:text="${type.inquiryTypeName}" th:selected="${search.inquiryTypeCode == type.inquiryTypeCode}">유형</option></select><svg class="select__arrow"><use href="#icon-chevron-down"></use></svg></label>
				<label class="qna-search"><svg><use href="#icon-search"></use></svg><span class="sr-only">제목 검색</span><input class="input" name="keyword" type="search" placeholder="제목으로 검색" th:value="${search.keyword}"></label>
				<label class="select"><span class="sr-only">답변 상태</span><select name="answerStatus"><option value="all" th:selected="${search.answerStatus == 'all'}">전체 답변 상태</option><option value="waiting" th:selected="${search.answerStatus == 'waiting'}">답변 대기</option><option value="answered" th:selected="${search.answerStatus == 'answered'}">답변 완료</option></select><svg class="select__arrow"><use href="#icon-chevron-down"></use></svg></label>
				<button class="btn btn--ghost" type="submit">조회</button>
			</form>

			<section class="qna-list-card" aria-label="1:1 문의 목록">
				<div class="qna-list-card__summary"><strong>1:1 문의 내역</strong><b th:text="|${#lists.size(inquiries)}건|">0건</b></div>
				<div class="qna-list-columns"><span>문의 유형</span><span>문의 제목</span><span>접수일</span><span>답변 상태</span><span>상세</span></div>
				<div class="qna-list" th:unless="${#lists.isEmpty(inquiries)}">
					<a class="qna-list-item" th:each="inquiry : ${inquiries}" th:href="@{/author/qna/{code}(code=${inquiry.inquiryCode})}">
						<span class="qna-list-item__type" th:text="${inquiry.inquiryTypeName}">유형</span><h2 th:text="${inquiry.title}">문의 제목</h2><time th:text="${inquiry.inquiryDate == null ? '-' : #dates.format(inquiry.inquiryDate, 'yyyy.MM.dd')}">접수일</time><span class="qna-status" th:classappend="${inquiry.answered} ? 'qna-status--complete' : 'qna-status--waiting'"><i></i><span th:text="${inquiry.answered} ? '답변 완료' : '답변 대기'">답변 상태</span></span><span class="qna-list-item__action">내용 보기<svg><use href="#icon-chevron-right"></use></svg></span>
					</a>
				</div>
				<p class="qna-list-empty" th:if="${#lists.isEmpty(inquiries)}">검색 조건에 맞는 1:1 문의가 없습니다.</p>
			</section>
			<div th:replace="~{author/fragments/footer :: footer}"></div>
		</div></main>
	</div>
</div>
</body>
</html>
