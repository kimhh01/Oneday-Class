<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>리뷰 관리 | 숨비당 원데이 클래스</title>
<link rel="stylesheet" th:href="@{/author/css/common.css}">
<link rel="stylesheet" th:href="@{/author/css/header.css}">
<link rel="stylesheet" th:href="@{/author/css/sidebar.css}">
<link rel="stylesheet" th:href="@{/author/css/management.css}">
<link rel="stylesheet" th:href="@{/author/css/review.css}">
<script th:src="@{/author/js/layout.js}" defer></script>
</head>
<body class="author-page management-page review-page" data-menu="review" data-page="리뷰 관리">
<div class="app">
	<div th:replace="~{author/fragments/icons :: icons}"></div>
	<div th:replace="~{author/fragments/header :: header}"></div>
	<div class="app-body">
		<div th:replace="~{author/fragments/sidebar :: sidebar}"></div>
		<main class="content">
			<div class="content__inner">
				<header class="mgmt-head">
					<div>
						<h1 class="page-title">리뷰 관리</h1>
						<p class="page-desc mgmt-head__desc">내 클래스에 등록된 리뷰를 확인하고 답글을 관리하세요.</p>
					</div>
				</header>

				<section class="mgmt-stats" aria-label="리뷰 요약">
					<div class="mgmt-stat"><span class="mgmt-stat__icon"><svg><use href="#icon-star"></use></svg></span><div class="mgmt-stat__body"><p class="mgmt-stat__label">전체 평점</p><!-- ReviewSummaryDTO에 평균 별점 필드가 없어 정적 문구를 유지한다 --><p class="mgmt-stat__value">0.0</p><p class="mgmt-stat__caption" th:text="|리뷰 ${summary.totalReviewCount}건 기준|">리뷰 0건 기준</p></div></div>
					<div class="mgmt-stat"><span class="mgmt-stat__icon"><svg><use href="#icon-chat"></use></svg></span><div class="mgmt-stat__body"><p class="mgmt-stat__label">전체 리뷰</p><p class="mgmt-stat__value"><span th:text="${summary.totalReviewCount}">0</span><small>건</small></p><p class="mgmt-stat__caption">누적 등록 수</p></div></div>
					<div class="mgmt-stat"><span class="mgmt-stat__icon"><svg><use href="#icon-check-circle"></use></svg></span><div class="mgmt-stat__body"><p class="mgmt-stat__label">답글 완료</p><p class="mgmt-stat__value"><span th:text="${summary.repliedReviewCount}">0</span><small>건</small></p><p class="mgmt-stat__caption" th:text="|전체의 ${summary.totalReviewCount == 0 ? 0 : summary.repliedReviewCount * 100 / summary.totalReviewCount}%|">전체의 0%</p></div></div>
					<div class="mgmt-stat"><span class="mgmt-stat__icon"><svg><use href="#icon-clock"></use></svg></span><div class="mgmt-stat__body"><p class="mgmt-stat__label">답글 대기</p><p class="mgmt-stat__value"><span th:text="${summary.unansweredReviewCount}">0</span><small>건</small></p><p class="mgmt-stat__caption">답글을 기다리는 리뷰</p></div></div>
				</section>

				<form class="mgmt-filter review-filter" method="get" th:action="@{/author/reviews}" aria-label="리뷰 검색 조건">
					<div class="mgmt-filter__field"><label class="mgmt-filter__label" for="reviewClass">클래스</label><div class="select"><select id="reviewClass" name="classCode"><option value="">전체 클래스</option><option th:each="item : ${classes}" th:value="${item.classCode}" th:text="${item.classTitle}" th:selected="${search.classCode == item.classCode}">클래스</option></select><svg class="select__arrow"><use href="#icon-chevron-down"></use></svg></div></div>
					<div class="mgmt-filter__field"><label class="mgmt-filter__label" for="reviewState">답글 상태</label><div class="select"><select id="reviewState" name="replyStatus"><option value="all" th:selected="${search.replyStatus == 'all'}">전체</option><option value="replied" th:selected="${search.replyStatus == 'replied'}">답글 완료</option><option value="pending" th:selected="${search.replyStatus == 'pending'}">답글 대기</option></select><svg class="select__arrow"><use href="#icon-chevron-down"></use></svg></div></div>
					<div class="mgmt-filter__field"><label class="mgmt-filter__label" for="reviewSort">정렬</label><div class="select"><select id="reviewSort" name="sortType"><option value="latest" th:selected="${search.sortType == 'latest'}">최신순</option><option value="oldest" th:selected="${search.sortType == 'oldest'}">오래된순</option><option value="ratingDesc" th:selected="${search.sortType == 'ratingDesc'}">별점 높은순</option><option value="ratingAsc" th:selected="${search.sortType == 'ratingAsc'}">별점 낮은순</option></select><svg class="select__arrow"><use href="#icon-chevron-down"></use></svg></div></div>
					<button class="btn btn--primary" type="submit">조회</button>
				</form>

				<div class="mgmt-tabs" role="navigation" aria-label="답글 상태별 보기">
					<a th:href="@{/author/reviews(classCode=${search.classCode},sortType=${search.sortType},replyStatus='all')}" th:attr="aria-current=${search.replyStatus == 'all'} ? 'page' : null">전체 <span th:text="${summary.totalReviewCount}">0</span></a>
					<a th:href="@{/author/reviews(classCode=${search.classCode},sortType=${search.sortType},replyStatus='replied')}" th:attr="aria-current=${search.replyStatus == 'replied'} ? 'page' : null">답글 완료 <span th:text="${summary.repliedReviewCount}">0</span></a>
					<a th:href="@{/author/reviews(classCode=${search.classCode},sortType=${search.sortType},replyStatus='pending')}" th:attr="aria-current=${search.replyStatus == 'pending'} ? 'page' : null">답글 대기 <span th:text="${summary.unansweredReviewCount}">0</span></a>
				</div>

				<p class="review-count">조회 결과 <b th:text="${reviewCount}">0</b>건</p>
				<section class="review-list" aria-label="리뷰 목록" th:unless="${#lists.isEmpty(reviews)}">
					<article class="review-card" th:each="review : ${reviews}" th:with="replied=${review.replyContent != null and !#strings.isEmpty(review.replyContent)}">
						<img class="review-card__thumb" th:src="${review.thumbnailPath != null and !#strings.isEmpty(review.thumbnailPath)} ? @{/uploads/author/{path}(path=${review.thumbnailPath})} : @{/author/images/photo/class-upload-placeholder.png}" alt="" width="132" height="100" loading="lazy">
						<div class="review-card__body">
							<div class="review-card__head"><div><h2 class="review-card__class" th:text="${review.classTitle}">클래스명</h2><span class="review-card__meta" th:text="|${review.memberName} · 수강생|">수강생</span></div><span class="badge" th:classappend="${replied} ? 'badge--green' : 'badge--amber'" th:text="${replied} ? '답글 완료' : '답글 대기'">답글 대기</span></div>
							<p class="review-stars"><span class="review-stars__mark" aria-hidden="true">★</span><span class="review-stars__score" th:text="${#numbers.formatDecimal(review.rating, 1, 1)}">5.0</span></p>
							<p class="review-card__text" th:text="${review.reviewContent}">리뷰 내용</p>
							<div class="review-reply" th:if="${replied}"><div class="review-reply__head"><span class="review-reply__label">작가 답글</span><time class="review-reply__date" th:text="${review.replyDate == null ? '' : #dates.format(review.replyDate, 'yyyy.MM.dd')}">답글일</time></div><p class="review-reply__text" th:text="${review.replyContent}">답글 내용</p></div>
						</div>
						<div class="review-card__side"><time class="review-card__date" th:text="${review.reviewDate == null ? '' : #dates.format(review.reviewDate, 'yyyy.MM.dd')}">작성일</time><a class="btn btn--sm" th:classappend="${replied} ? 'btn--ghost' : 'btn--outline'" th:href="@{/author/reviews/{code}(code=${review.reviewCode},mode=${replied ? 'view' : 'create'})}" th:text="${replied} ? '상세 보기' : '답글 작성'">상세 보기</a></div>
					</article>
				</section>
				<p class="mgmt-empty" th:if="${#lists.isEmpty(reviews)}">조건에 맞는 리뷰가 없습니다.</p>
				<div th:replace="~{author/fragments/footer :: footer}"></div>
			</div>
		</main>
	</div>
</div>
</body>
</html>
