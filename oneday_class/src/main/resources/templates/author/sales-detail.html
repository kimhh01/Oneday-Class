<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>결제 상세 | 숨비당 원데이 클래스</title>
<link rel="stylesheet" th:href="@{/author/css/common.css}"><link rel="stylesheet" th:href="@{/author/css/header.css}"><link rel="stylesheet" th:href="@{/author/css/sidebar.css}"><link rel="stylesheet" th:href="@{/author/css/sales.css}"><script th:src="@{/author/js/layout.js}" defer></script></head>
<body class="author-page sales-page sales-detail-page" data-menu="sales" data-page="결제 상세"><div class="app"><div th:replace="~{author/fragments/icons :: icons}"></div><div th:replace="~{author/fragments/header :: header}"></div><div class="app-body"><div th:replace="~{author/fragments/sidebar :: sidebar}"></div><main class="content"><div class="content__inner sales-shell">
<header class="sales-head"><div><p class="sales-head__path">매출 현황 <svg><use href="#icon-chevron-right"></use></svg> 결제 상세</p><h1 class="page-title">결제 상세</h1><p><b th:text="${'P-' + payment.paymentCode}">P-000000-00</b> 결제의 주문·정산 정보를 확인합니다.</p></div><div class="sales-head__actions"><a class="btn btn--ghost" th:href="@{/author/sales}"><svg><use href="#icon-chevron-left"></use></svg> 매출 현황</a><a class="btn btn--primary" th:href="@{/author/settlements/new}">정산 가능 내역</a></div></header>
<section class="payment-summary" aria-label="결제 금액 요약"><div><span>결제금액</span><strong th:text="|${#numbers.formatInteger(payment.paymentAmount,1,'COMMA')}원|">0원</strong><p>승인 결제 금액</p></div><div><span>환불 금액</span><strong class="is-red" th:text="|${#numbers.formatInteger(payment.cancelAmount,1,'COMMA')}원|">0원</strong><p th:text="${payment.cancelAmount == 0 ? '환불 내역 없음' : '환불 반영 금액'}">-</p></div><div><span>정산 수수료 (10%)</span><strong class="is-red" th:text="|${#numbers.formatInteger(payment.platformFeeAmount,1,'COMMA')}원|">0원</strong><p>결제금액의 10%</p></div><div><span>정산액</span><strong class="is-green" th:text="|${#numbers.formatInteger(payment.settlementAmount,1,'COMMA')}원|">0원</strong><p th:text="${payment.settlementStatus}">정산 상태</p></div></section>
<div class="payment-detail-grid"><section class="payment-card payment-order"><div class="payment-card__head"><div><span>주문·클래스 정보</span><h2 th:text="${payment.classTitle}">클래스명</h2></div><img th:src="@{/author/images/photo/class-upload-placeholder.png}" alt=""></div><dl class="payment-info"><div><dt>클래스 일정</dt><dd th:text="${payment.scheduleDate == null ? '-' : #dates.format(payment.scheduleDate, 'yyyy.MM.dd')}">-</dd></div><div><dt>수강생</dt><dd th:text="${payment.memberName}">-</dd></div><div><dt>결제 수단</dt><dd th:text="${payment.paymentMethod}">-</dd></div><div><dt>결제 일시</dt><dd th:text="${payment.paymentDate == null ? '-' : #dates.format(payment.paymentDate, 'yyyy.MM.dd HH:mm')}">-</dd></div><div><dt>PG 승인 번호</dt><dd>-</dd></div><div><dt>결제 상태</dt><dd><span class="sales-status" th:classappend="${payment.cancelAmount > 0} ? 'sales-status--refunded' : 'sales-status--paid'"><i></i><span th:text="${payment.paymentStatus}">상태</span></span></dd></div></dl></section>
<aside class="payment-side"><section class="payment-card"><h2>구매자 정보</h2><dl class="buyer-info"><div><dt>이름</dt><dd th:text="${payment.memberName}">-</dd></div><div><dt>연락처</dt><dd>-</dd></div><div><dt>이메일</dt><dd th:text="${payment.memberEmail}">-</dd></div></dl></section><section class="payment-card settlement-state"><h2>정산 상태</h2><span class="settlement-state__badge"><svg><use href="#icon-clock"></use></svg><span th:text="${payment.settlementStatus}">정산 상태</span></span><p th:text="${payment.settlementStatus == '정산가능' ? '이 결제 건을 정산 신청에서 선택할 수 있습니다.' : '정산 신청 대상이 아니거나 이미 정산에 포함된 결제입니다.'}">-</p><a th:if="${payment.settlementStatus == '정산가능'}" th:href="@{/author/settlements/new}">정산 신청 화면으로 이동 <svg><use href="#icon-chevron-right"></use></svg></a></section></aside></div>
<div th:replace="~{author/fragments/footer :: footer}"></div></div></main></div></div></body></html>
