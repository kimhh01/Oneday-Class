<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>정산 내역 | 숨비당 원데이 클래스</title>
<link rel="stylesheet" th:href="@{/author/css/common.css}"><link rel="stylesheet" th:href="@{/author/css/header.css}"><link rel="stylesheet" th:href="@{/author/css/sidebar.css}"><link rel="stylesheet" th:href="@{/author/css/management.css}"><link rel="stylesheet" th:href="@{/author/css/settlement-history.css}"><script th:src="@{/author/js/layout.js}" defer></script></head>
<body class="author-page settlement-history-page" data-menu="settlement-history" data-page="정산 내역"><div class="app"><div th:replace="~{author/fragments/icons :: icons}"></div><div th:replace="~{author/fragments/header :: header}"></div><div class="app-body"><div th:replace="~{author/fragments/sidebar :: sidebar}"></div><main class="content"><div class="content__inner settlement-shell">
<header class="settlement-head"><div><h1 class="page-title">정산 내역</h1><p class="page-desc settlement-head__desc">완료된 정산과 현재 처리 중인 금액을 한눈에 확인해보세요.</p></div><div class="settlement-head__actions"><a class="btn btn--ghost" th:href="@{/author/settlements/excel(period=${period},status=${status},keyword=${keyword})}">정산 다운로드</a><a class="btn btn--ghost" th:href="@{/author/sales}">매출 현황</a><a class="btn btn--primary" th:href="@{/author/settlements/new}">정산 신청하기</a></div></header>
<section class="settlement-summary" aria-label="정산 금액 요약"><article class="summary-card summary-card--total"><span class="summary-card__icon"><svg><use href="#icon-wallet"></use></svg></span><div><p>누적 정산 금액</p><strong th:text="|${#numbers.formatInteger(settlementDashboard.completedAmount,1,'COMMA')}원|">0원</strong><span th:text="|${settlementDashboard.completedCount}건 완료|">0건 완료</span></div></article>
<article class="summary-card summary-card--pending"><span class="summary-card__icon"><svg><use href="#icon-clock"></use></svg></span><div><p>처리 중</p><strong th:text="|${#numbers.formatInteger(settlementDashboard.requestedAmount,1,'COMMA')}원|">0원</strong><span th:text="|${settlementDashboard.requestedCount}건 처리 중|">0건 처리 중</span></div></article>
<article class="summary-card summary-card--recent"><span class="summary-card__icon"><svg><use href="#icon-check-circle"></use></svg></span><div><p>신청 가능</p><strong th:text="|${#numbers.formatInteger(settlementDashboard.availableAmount,1,'COMMA')}원|">0원</strong><span>현재 신청 가능한 금액</span></div></article></section>
<section class="settlement-filter card"><form method="get" th:action="@{/author/settlements}"><div class="settlement-filter__item"><label for="settlementPeriod">정산 기간</label><div class="select"><select id="settlementPeriod" name="period"><option value="all" th:selected="${period == 'all'}">전체 기간</option><option value="30" th:selected="${period == '30'}">최근 1개월</option><option value="90" th:selected="${period == '90'}">최근 3개월</option><option value="180" th:selected="${period == '180'}">최근 6개월</option></select><svg class="select__arrow"><use href="#icon-chevron-down"></use></svg></div></div>
<div class="settlement-filter__item"><label for="settlementStatus">정산 상태</label><div class="select"><select id="settlementStatus" name="status"><option value="all" th:selected="${status == 'all'}">전체 상태</option><option value="waiting" th:selected="${status == 'waiting'}">정산대기</option><option value="hold" th:selected="${status == 'hold'}">정산보류</option><option value="completed" th:selected="${status == 'completed'}">정산완료</option></select><svg class="select__arrow"><use href="#icon-chevron-down"></use></svg></div></div>
<div class="settlement-filter__item settlement-filter__item--search"><label for="settlementSearch">검색</label><div class="settlement-search"><svg><use href="#icon-search"></use></svg><input class="input" type="search" id="settlementSearch" name="keyword" th:value="${keyword}" placeholder="정산 그룹 PK 또는 정산 계좌"></div></div><button class="btn btn--primary settlement-filter__submit" type="submit"><svg><use href="#icon-search"></use></svg>조회</button><a class="settlement-filter__reset" th:href="@{/author/settlements}">초기화</a></form></section>
<section class="settlement-list card"><header class="settlement-list__head"><div><h2>정산 내역</h2><p>총 <strong th:text="${settlementCount}">0</strong>건의 정산이 조회되었습니다.</p></div><p class="settlement-list__amount">현재 페이지 금액 <strong th:text="|${#numbers.formatInteger(visibleAmount,1,'COMMA')}원|">0원</strong></p></header>
<div class="settlement-table-wrap"><table class="settlement-table"><thead><tr><th>정산 번호</th><th>신청일</th><th>정산 기간</th><th>건수</th><th>정산 계좌</th><th class="is-number">매출액</th><th class="is-number">수수료 (10%)</th><th class="is-number">정산 금액</th><th class="is-center">상태</th><th class="is-center">관리</th></tr></thead><tbody>
<tr class="settlement-row" th:each="item : ${settlements}"><td data-label="정산 번호"><a class="settlement-code" th:href="@{/author/settlements/{id}(id=${item.settlementCode})}" th:text="${'S-' + item.settlementCode}">S-0000-0000</a></td><td data-label="신청일" th:text="${item.appliedAt == null ? '-' : #dates.format(item.appliedAt, 'yyyy.MM.dd')}">-</td><td data-label="정산 기간" th:text="${(item.periodStartDate == null ? '-' : #dates.format(item.periodStartDate,'yy.MM.dd')) + ' ~ ' + (item.periodEndDate == null ? '-' : #dates.format(item.periodEndDate,'yy.MM.dd'))}">-</td><td data-label="건수" th:text="|${item.paymentCount}건|">0건</td><td data-label="정산 계좌" th:text="${#strings.isEmpty(item.accountNumber) ? '미등록' : item.accountNumber}">-</td><td data-label="매출액" class="is-number" th:text="|${#numbers.formatInteger(item.totalPaymentAmount ?: 0,1,'COMMA')}원|">0원</td><td data-label="수수료 (10%)" class="is-number is-fee" th:text="|${#numbers.formatInteger(item.totalFeeAmount ?: 0,1,'COMMA')}원|">0원</td><td data-label="정산 금액" class="is-number is-settlement" th:text="|${#numbers.formatInteger(item.settlementAmount ?: 0,1,'COMMA')}원|">0원</td><td data-label="상태" class="is-center"><span class="settlement-badge" th:classappend="|settlement-badge--${item.settlementStatus == '정산완료' ? 'is-completed' : 'is-waiting'}|"><i></i><span th:text="${item.settlementStatus == '정산완료' ? '지급 완료' : (item.settlementStatus == '정산보류' ? '보류' : '처리 중')}">정산대기</span></span></td><td data-label="관리" class="is-center"><a class="row-detail" th:href="@{/author/settlements/{id}(id=${item.settlementCode})}">상세</a></td></tr></tbody></table></div>
<div class="settlement-empty" th:if="${#lists.isEmpty(settlements)}"><span><svg><use href="#icon-search"></use></svg></span><strong>조건에 맞는 정산 내역이 없습니다.</strong><p>기간이나 검색어를 변경해 다시 조회해주세요.</p></div>
<nav class="settlement-pagination" aria-label="정산 목록 페이지" th:if="${totalPages > 1}"><a th:classappend="${currentPage == 1} ? 'is-disabled'" th:href="@{/author/settlements(period=${period},status=${status},keyword=${keyword},page=${currentPage - 1})}" aria-label="이전 페이지">‹</a><a th:each="pageNo : ${#numbers.sequence(1, totalPages)}" th:href="@{/author/settlements(period=${period},status=${status},keyword=${keyword},page=${pageNo})}" th:text="${pageNo}" th:attr="aria-current=${pageNo == currentPage ? 'page' : null}">1</a><a th:classappend="${currentPage == totalPages} ? 'is-disabled'" th:href="@{/author/settlements(period=${period},status=${status},keyword=${keyword},page=${currentPage + 1})}" aria-label="다음 페이지">›</a></nav></section>
<div th:replace="~{author/fragments/footer :: footer}"></div></div></main></div></div></body></html>
