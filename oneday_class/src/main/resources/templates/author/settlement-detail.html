<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>정산 상세 | Oneclass</title><link rel="stylesheet" th:href="@{/author/css/common.css}"><link rel="stylesheet" th:href="@{/author/css/header.css}"><link rel="stylesheet" th:href="@{/author/css/sidebar.css}"><link rel="stylesheet" th:href="@{/author/css/settlement-detail.css}"><script th:src="@{/author/js/layout.js}" defer></script></head>
<body class="author-page settlement-detail-page" data-menu="settlement-history" data-page="정산 상세"><div class="app"><div th:replace="~{author/fragments/icons :: icons}"></div><div th:replace="~{author/fragments/header :: header}"></div><div class="app-body"><div th:replace="~{author/fragments/sidebar :: sidebar}"></div><main class="content"><div class="content__inner settlement-detail-shell">
<header class="detail-head"><div><p class="detail-head__path">정산 내역 <svg><use href="#icon-chevron-right"></use></svg> 정산 상세</p><h1 class="page-title">정산 상세</h1><p><b th:text="${'S-' + detail.settlementCode}">S-0000-0000</b> 정산의 처리 내용과 포함 매출을 확인합니다.</p></div><a class="btn btn--ghost" th:href="@{/author/settlements}"><svg><use href="#icon-chevron-left"></use></svg> 정산 내역</a></header>
<section class="detail-summary" aria-label="정산 금액 요약"><article><span>총 매출액</span><strong class="is-blue" th:text="|${#numbers.formatInteger(detail.totalPaymentAmount ?: 0,1,'COMMA')}원|">0원</strong><p th:text="|포함 매출 ${#lists.size(detail.targetList)}건|">0건</p></article><article><span>수수료 (10%)</span><strong class="is-red" th:text="|-${#numbers.formatInteger(detail.totalFeeAmount ?: 0,1,'COMMA')}원|">0원</strong><p>정산 수수료 합계</p></article><article><span>최종 정산금</span><strong class="is-green" th:text="|${#numbers.formatInteger(detail.settlementAmount ?: 0,1,'COMMA')}원|">0원</strong><p th:text="${detail.appliedAt == null ? '-' : #dates.format(detail.appliedAt, 'yyyy.MM.dd')}">-</p></article><span class="detail-status"><i></i><span th:text="${detail.settlementStatus == '정산완료' ? '지급 완료' : (detail.settlementStatus == '정산보류' ? '보류' : '처리 중')}">정산대기</span></span></section>
<div class="detail-grid"><section class="detail-card sales-breakdown"><header><div><h2>포함 매출</h2><p>이번 정산에 포함된 결제 내역입니다.</p></div><span th:text="|총 ${#lists.size(detail.targetList)}건|">0건</span></header><div class="breakdown-list"><a class="breakdown-row" th:each="payment : ${detail.targetList}" th:href="@{/author/sales/{id}(id=${payment.paymentCode})}"><span class="breakdown-code" th:text="${'P-' + payment.paymentCode}">P-000000-00</span><strong th:text="${payment.classTitle}">클래스</strong><span class="breakdown-date" th:text="${payment.availableDate == null ? '-' : #dates.format(payment.availableDate, 'yyyy.MM.dd')}">-</span><b th:text="|${#numbers.formatInteger(payment.settlementAmount,1,'COMMA')}원|">0원</b><svg><use href="#icon-chevron-right"></use></svg></a></div><footer><span>매출 정산액 합계</span><strong th:text="|${#numbers.formatInteger(detail.settlementAmount ?: 0,1,'COMMA')}원|">0원</strong></footer></section>
<aside class="detail-card settlement-account"><div class="account-profile"><img th:src="@{/author/images/photo/studio-profile.png}" alt="작가 프로필"><span><svg><use href="#icon-check"></use></svg></span></div><header><h2>지급 정보</h2><p>등록된 정산 계좌 정보입니다.</p></header><dl><div><dt>예금주</dt><dd th:text="${detail.authorName}">-</dd></div><div><dt>정산 계좌</dt><dd th:text="${#strings.isEmpty(detail.accountNumber) ? '미등록' : detail.accountNumber}">-</dd></div><div><dt>신청일</dt><dd th:text="${detail.appliedAt == null ? '-' : #dates.format(detail.appliedAt, 'yyyy.MM.dd')}">-</dd></div><div><dt>정산 번호</dt><dd th:text="${'S-' + detail.settlementCode}">-</dd></div></dl><div class="account-state"><span><svg><use href="#icon-check-circle"></use></svg><span th:text="${detail.settlementStatus == '정산완료' ? '지급 완료' : (detail.settlementStatus == '정산보류' ? '보류' : '처리 중')}">정산대기</span></span><p>정산 처리 상태는 관리자 확인 결과에 따라 변경됩니다.</p></div></aside></div>
<div th:replace="~{author/fragments/footer :: footer}"></div></div></main></div></div></body></html>
