<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>1:1 문의 상세 | 숨비당 원데이 클래스</title>
<link rel="stylesheet" th:href="@{/author/css/common.css}"><link rel="stylesheet" th:href="@{/author/css/header.css}"><link rel="stylesheet" th:href="@{/author/css/sidebar.css}"><link rel="stylesheet" th:href="@{/author/css/qna.css(v='20260805-3')}"><script th:src="@{/author/js/layout.js}" defer></script>
</head>
<body class="author-page qna-page qna-detail-page" data-menu="qna" data-page="1:1 문의 상세">
<div class="app"><div th:replace="~{author/fragments/icons :: icons}"></div><div th:replace="~{author/fragments/header :: header}"></div><div class="app-body"><div th:replace="~{author/fragments/sidebar :: sidebar}"></div>
	<main class="content"><div class="content__inner">
		<header class="qna-page-head"><div><h1 class="page-title">1:1 문의 상세</h1><p class="page-desc">문의 내용과 관리자 답변을 확인합니다.</p></div><a class="btn btn--ghost qna-page-head__action" th:href="@{/author/qna}">문의 목록</a></header>
		<section class="qna-detail-summary"><dl><div><dt>문의번호</dt><dd class="is-code" th:text="${inquiry.inquiryCode}">1</dd></div><div><dt>문의 유형</dt><dd th:text="${inquiry.inquiryTypeName}">유형</dd></div><div><dt>접수일</dt><dd th:text="${inquiry.inquiryDate == null ? '-' : #dates.format(inquiry.inquiryDate, 'yyyy.MM.dd HH:mm')}">접수일</dd></div></dl><span class="qna-status" th:classappend="${inquiry.answered} ? 'qna-status--complete' : 'qna-status--waiting'"><i></i><span th:text="${inquiry.answered} ? '답변 완료' : '답변 대기'">답변 상태</span></span></section>
		<div class="qna-detail-layout">
			<article class="qna-detail-card qna-question"><h2 th:text="${inquiry.title}">문의 제목</h2><p th:text="${inquiry.content}">문의 내용</p><div class="qna-attachments" th:if="${inquiry.inquiryImg != null and !#strings.isEmpty(inquiry.inquiryImg)}"><span>첨부 이미지</span><a th:href="${inquiry.inquiryImg}" target="_blank" rel="noopener"><svg><use href="#icon-doc-text"></use></svg>첨부 이미지 보기</a></div></article>
			<article class="qna-detail-card qna-answer" th:if="${inquiry.answered}"><span class="qna-answer__badge">답변 완료</span><h2>관리자 답변</h2><p th:text="${inquiry.answer}">답변 내용</p><div class="qna-answer__meta" th:text="|답변일 ${inquiry.answerDate == null ? '-' : #dates.format(inquiry.answerDate, 'yyyy.MM.dd HH:mm')} · ${inquiry.managerName ?: '관리자'}|">답변 정보</div><div class="qna-answer__notice"><strong>추가 확인이 필요한가요?</strong><p>새 1:1 문의를 등록해 주세요.</p></div></article>
			<article class="qna-detail-card qna-answer" th:unless="${inquiry.answered}"><span class="qna-status qna-status--waiting"><i></i>답변 대기</span><h2>관리자가 문의를 확인하고 있습니다.</h2><p>답변이 등록되면 이 화면에서 바로 확인할 수 있습니다.</p></article>
		</div>
		<div th:replace="~{author/fragments/footer :: footer}"></div>
	</div></main>
</div></div>
</body>
</html>
