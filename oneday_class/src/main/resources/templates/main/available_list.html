<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>예약 가능 클래스 - 검색 결과</title>
    <link rel="stylesheet" th:href="@{/search/css/search.css}">
</head>
<body>

<div th:replace="~{common/header :: headerFragment}"></div>

<main class="main-container">
    <section class="result-section">
        <!-- 타이틀 영역 -->
        <h2 class="section-title">
            <span>
                <th:block th:if="${scheduleDTO != null and scheduleDTO.date != null}" 
                          th:text="${#dates.format(scheduleDTO.date, 'yyyy.MM.dd')} + '예약 가능 클래스'">
                </th:block>
                <th:block th:if="${scheduleDTO == null or scheduleDTO.date == null}">
                    예약 가능 클래스
                </th:block>
            </span>
        </h2>

        <!-- 검색 결과 없을 때 -->
        <div th:if="${#lists.isEmpty(availableList)}" style="color: #888; padding: 60px 0; text-align: center;">
            선택하신 조건에 예약 가능한 클래스가 없습니다.
        </div>

        <!-- 검색 결과 목록 (search.css의 class-list 구조) -->
        <div class="class-list" th:if="${!#lists.isEmpty(availableList)}">
            <div class="class-item" th:each="cls : ${availableList}">
                <a th:href="@{/class/detail(classCode=${cls.classCode})}" style="display: flex; gap: 20px; width: 100%;">
                    <img th:src="${cls.mainImage != null and cls.mainImage.startsWith('http') ? cls.mainImage : '/images/class/' + cls.mainImage}" 
                         th:alt="${cls.name}" class="class-img">
                    
                    <div class="class-info">
                        <div class="class-location" th:text="${cls.address}">위치 정보</div>
                        <div class="class-title" th:text="${cls.name}">클래스명</div>
                        
                        <div class="class-price-info">
                            <!-- 1) 빨간색 할인율 (%) -->
                            <span class="discount-rate" 
                                  th:if="${cls.desiredPrice != null and cls.desiredPrice > 0 and cls.desiredPrice > cls.price}" 
                                  th:text="${cls.discountRate + '%'}"></span>
                            
                            <!-- 2) 회색 취소선 정가 (desiredPrice) -->
                            <span class="original-price" 
                                  th:if="${cls.desiredPrice != null and cls.desiredPrice > 0 and cls.desiredPrice > cls.price}" 
                                  th:text="${#numbers.formatInteger(cls.desiredPrice, 0, 'COMMA')}"></span>
                            
                            <!-- 3) 검정색 최종 판매가 (price) -->
                            <span class="final-price" 
                                  th:text="${#numbers.formatInteger(cls.price, 0, 'COMMA') + '원'}"></span>
                        </div>
                    </div>
                </a>
            </div>
        </div>
    </section>
</main>

<div th:replace="~{common/footer :: footerFragment}"></div>

</body>
</html>
