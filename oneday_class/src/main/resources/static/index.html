<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>숨비당 원데이 클래스</title>
<link rel="stylesheet" href="css/common.css">
<style>
/* 메인 페이지 퍼블리싱 전 임시 랜딩. 메인 시안 나오면 이 파일을 교체하면 됩니다. */
.landing {
	min-height: 100%;
	display: grid;
	place-items: center;
	padding: 40px 20px;
}
.landing__box {
	width: 100%;
	max-width: 420px;
	padding: 32px;
	text-align: center;
	background: var(--bg-card);
	border: 1px solid var(--border);
	border-radius: var(--radius-lg);
	box-shadow: var(--shadow-card);
}
.landing__logo {
	display: inline-flex;
	align-items: center;
	gap: 8px;
	font-size: 20px;
	font-weight: 700;
	letter-spacing: -.02em;
}
.landing__logo svg { width: 24px; height: 24px; color: var(--green-600); }
.landing__desc { margin: 8px 0 24px; font-size: 13px; color: var(--text-muted); }
.landing__links { display: grid; gap: 8px; }
</style>
</head>
<body>

<div class="landing">
	<div class="landing__box">
		<p class="landing__logo">
			<svg viewBox="0 0 24 24">
				<path d="M20 3.5S5.5 4.5 5.5 14c0 3.6 2.6 6.5 6.5 6.5C18.5 20.5 20 12 20 3.5z"/>
				<path d="M9 20c1.2-5.5 4-9 8.5-11.5"/>
			</svg>
			숨비당 원데이 클래스
		</p>
		<p class="landing__desc">퍼블리싱 진행 중입니다. 아래에서 화면을 확인하세요.</p>

		<div class="landing__links">
			<a href="author/index.html" class="btn btn--primary">작가페이지 홈</a>
		</div>
	</div>
</div>

</body>
</html>
