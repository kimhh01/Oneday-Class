<!-- =============================================================
	 header.html - 상단 공통 헤더
	 * 브레드크럼 마지막 항목은 각 페이지 body 의 data-page 값으로 채워집니다.
	   (js/layout.js 참고)
	 ============================================================= -->
<header class="app-header">
	<div class="app-header__left">
		<button type="button" class="icon-btn sidebar-toggle" data-sidebar-toggle>
			<svg><use href="#icon-menu"></use></svg>
			<span class="sr-only">메뉴 열기</span>
		</button>

		<a href="../index.html" class="brand">
			<svg><use href="#icon-leaf"></use></svg>
			숨비당 <span class="brand__sub">원데이 클래스</span>
		</a>

		<nav class="breadcrumb" aria-label="현재 위치">
			<a href="index.html">작가페이지</a>
			<svg><use href="#icon-chevron-right"></use></svg>
			<span class="is-current" data-breadcrumb-current>홈</span>
		</nav>
	</div>

	<div class="app-header__right">
		<button type="button" class="icon-btn">
			<svg><use href="#icon-bell"></use></svg>
			<span class="icon-btn__count">3</span>
			<span class="sr-only">알림</span>
		</button>

		<button type="button" class="icon-btn">
			<svg><use href="#icon-mail"></use></svg>
			<span class="icon-btn__count">2</span>
			<span class="sr-only">쪽지</span>
		</button>

		<button type="button" class="user-chip">
			<span class="avatar">포근</span>
			<span class="user-chip__name">포근공방 작가님</span>
			<svg><use href="#icon-chevron-down"></use></svg>
		</button>
	</div>
</header>
