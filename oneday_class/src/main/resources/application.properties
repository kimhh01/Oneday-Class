spring.application.name=oneday_class
spring.profiles.active=dev

spring.datasource.url=${ONEDAY_DB_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
spring.datasource.username=${ONEDAY_DB_USERNAME:oneday}
spring.datasource.password=${ONEDAY_DB_PASSWORD:}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

mybatis.mapper-locations=classpath:/mapper/**/*.xml
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.jdbc-type-for-null=NULL

oneday.author.upload-root=${ONEDAY_UPLOAD_ROOT:uploads/author}
oneday.maps.kakao-app-key=${KAKAO_MAP_APP_KEY:323c51a41e8ba9494c15f65107a4cfb2}
